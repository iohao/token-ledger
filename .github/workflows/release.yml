name: Release Desktop App

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.6"
  CI: true

jobs:
  validate-release:
    name: Validate Release Version
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify tag matches app version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          app_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          expected_tag="v${app_version}"
          if [ "$TAG_NAME" != "$expected_tag" ]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $app_version (expected $expected_tag)."
            exit 1
          fi

  create-release:
    name: Create GitHub Release
    needs: validate-release
    runs-on: ubuntu-22.04

    steps:
      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
          else
            notes=()
            if [ "$TAG_NAME" = "v2.0.0" ]; then
              notes=(--notes "Major upgrade: TokenLedger 2.0.0 moves from Tauri to Electron. Existing Tauri installations cannot update in-app to this release; download and install the new desktop package manually. Later Electron releases will support in-app updates.")
            fi
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --draft \
              --generate-notes \
              "${notes[@]}"
          fi

  build-and-upload:
    name: Build And Upload (${{ matrix.label }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            target_args: --mac --x64 --arm64
          - os: windows-latest
            label: Windows
            target_args: --win --x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend types
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Build frontend and Electron bundle
        run: bun run build

      - name: Remove development-only agent links
        run: >-
          bun -e 'import { rmSync } from "node:fs"; rmSync(".agents/skills", { recursive: true, force: true });'

      - name: Package desktop app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/electron-builder ${{ matrix.target_args }} --publish never

      - name: Upload release assets to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          case "${{ matrix.label }}" in
            macOS) packages=(release-app/*.dmg release-app/*.zip) ;;
            Windows) packages=(release-app/*.exe release-app/*.zip) ;;
          esac

          if [ ${#packages[@]} -eq 0 ] || ! compgen -G "release-app/latest*.yml" > /dev/null; then
            echo "::error::Missing package or Electron update metadata for ${{ matrix.label }}."
            exit 1
          fi

          for metadata_file in release-app/latest*.yml; do
            while IFS= read -r package_name; do
              if [ ! -f "release-app/$package_name" ]; then
                echo "::error::Update metadata $metadata_file references missing package $package_name."
                exit 1
              fi
            done < <(sed -nE 's/^[[:space:]]*-[[:space:]]+url:[[:space:]]*//p; s/^path:[[:space:]]*//p' "$metadata_file")
          done

          assets=("${packages[@]}" release-app/*.blockmap release-app/latest*.yml)
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber

  publish-release:
    name: Publish Release (undraft)
    needs: build-and-upload
    runs-on: ubuntu-22.04

    steps:
      - name: Undraft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false
