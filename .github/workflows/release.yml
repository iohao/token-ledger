name: Release Desktop App

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CI: true

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04

    steps:
      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists."
          else
            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --draft \
              --generate-notes
          fi

  build-and-upload:
    name: Build And Upload (${{ matrix.label }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            target_flag: --mac
          - os: windows-latest
            label: Windows
            target_flag: --win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check frontend types
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Build frontend and Electron bundle
        run: bun run build

      - name: Package desktop app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/electron-builder ${{ matrix.target_flag }} --publish never

      - name: Upload release assets to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(release-app/*.dmg release-app/*.zip release-app/*.exe release-app/*.msi release-app/latest*.yml release-app/latest*.json)
          if [ ${#assets[@]} -gt 0 ]; then
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          fi

  publish-release:
    name: Publish Release (undraft)
    needs: build-and-upload
    runs-on: ubuntu-22.04

    steps:
      - name: Undraft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false
