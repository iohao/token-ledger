name: Desktop CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact_name: desktop-bundle-macos
            package_cmd: bun run package:mac
          - os: windows-latest
            label: Windows
            artifact_name: desktop-bundle-windows
            package_cmd: bun run package:win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check TypeScript types
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Build frontend and Electron bundle
        run: bun run build

      - name: Build desktop packages
        run: ${{ matrix.package_cmd }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release-app/
          if-no-files-found: error
          retention-days: 14
